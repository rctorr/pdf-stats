name: Construir Ejecutables Multiplataforma

# -------------------------------------------------                                  
# 👇 NEW: give the default token the required scopes                                 
permissions:                                                                         
  contents: write          # needed to create a release                              
  # optional but useful for future steps                                             
  packages: write                                                                    
  # explicit release permission (GitHub added this later)                            
  # releases: write         # uncomment if you have a newer repo where this is required 
# ------------------------------------------------- 

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Compilar para ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: pdf-stats-windows
            asset_name: pdf-stats-windows.zip
          - os: ubuntu-latest
            artifact_name: pdf-stats-linux
            asset_name: pdf-stats-linux.tar.gz
          - os: macos-latest
            artifact_name: pdf-stats-macos
            asset_name: pdf-stats-macos.zip

    steps:
      - name: Descargar Código Fuente
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias del sistema (Solo Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer-plugins-base1.0-dev freeglut3-dev

      - name: Instalar uv
        uses: astral-sh/setup-uv@v3

      - name: Instalar Dependencias del Proyecto
        run: |
          uv venv
          uv pip install -e .
          uv pip install gooey pyinstaller six --find-links https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04 || uv pip install gooey pyinstaller six

      - name: Compilar con PyInstaller (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          GOOEY_PATH=$(uv run python -c 'import gooey, os; print(os.path.dirname(gooey.__file__))')
          uv run pyinstaller --noconfirm --onedir --windowed --name "pdf-stats" --add-data "${GOOEY_PATH}:gooey" pdf_stats/__main__.py

      - name: Compilar con PyInstaller (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $gooeyPath = uv run python -c "import gooey, os; print(os.path.dirname(gooey.__file__))"
          uv run pyinstaller --noconfirm --onedir --windowed --name "pdf-stats" --add-data "${gooeyPath};gooey" pdf_stats/__main__.py

      - name: Empaquetar Artefacto (Windows Zip)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Compress-Archive -Path dist/pdf-stats -DestinationPath ${{ matrix.asset_name }}

      - name: Empaquetar Artefacto (macOS Zip)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r ../${{ matrix.asset_name }} pdf-stats/

      - name: Empaquetar Artefacto (Linux Tar.gz)
        if: runner.os == 'Linux'
        run: |
          cd dist
          tar -czvf ../${{ matrix.asset_name }} pdf-stats/

      - name: Subir Artefacto Compilado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.asset_name }}

  release:
    name: Publicar Release en GitHub
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # ── Se necesita el código fuente completo para que git-cliff lea el historial ──
      - name: Descargar Código Fuente (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 0 = clonar TODO el historial de commits y tags

      # ── Generar el cuerpo del release automáticamente con git-cliff ──
      - name: Generar Changelog del Release
        uses: orhun/git-cliff-action@v3
        id: git-cliff
        with:
          config: cliff.toml          # usa nuestra configuración
          args: --latest --strip header  # solo el bloque de la última versión, sin encabezado global
        env:
          OUTPUT: RELEASE_BODY.md     # guarda el resultado en este archivo temporal
          GITHUB_REPO: ${{ github.repository }}

      # ── Descargar los ejecutables compilados por el job anterior ──
      - name: Descargar Todos los Artefactos
        uses: actions/download-artifact@v4

      # ── Publicar la release con el cuerpo generado automáticamente ──
      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          files: |
            pdf-stats-windows/pdf-stats-windows.zip
            pdf-stats-linux/pdf-stats-linux.tar.gz
            pdf-stats-macos/pdf-stats-macos.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
